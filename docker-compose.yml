version: '3.8'

services:
  dashboard-metrics:
    build: .
    container_name: dashboard-metrics-processor
    restart: "no"
    network_mode: host
    environment:
      # Configuration Store
      - CONFIG_STORE_BASE_URL=https://z-config-store.48.216.130.212.nip.io
      - CONFIG_STORE_API_KEY=891f41ee454479c49e458c4a7c50dd1e

      # Database Configuration
      - DATABASE_URL=postgresql://z_agent_user:z_agent_password@localhost:5555/z_agent

      # Application Settings
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  dashboard-network:
    driver: bridge

volumes:
  logs:
    driver: local